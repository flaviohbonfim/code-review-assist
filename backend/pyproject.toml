[tool.poetry]
name = "code-review-assist-backend"
version = "0.1.0"
description = "Backend para Code Review Assist - AI + AST Visual PR Review"
authors = ["Flavio Bonfim"]
readme = "../README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = ">=0.110.0"
uvicorn = {extras = ["standard"], version = ">=0.28.0"}
pydantic = ">=2.6.0"
httpx = ">=0.27.0"
python-multipart = ">=0.0.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
